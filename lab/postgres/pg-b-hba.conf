# Container-local administration is allowed through the Unix socket.
local all all trust
# TCP clients must use TLS and authenticate. Certificate verification remains
# the client's responsibility; these rules do not establish client validation.
hostssl all all 0.0.0.0/0 scram-sha-256
hostssl all all ::/0 scram-sha-256
hostnossl all all 0.0.0.0/0 reject
hostnossl all all ::/0 reject
